; Declarative metadata lives here (not pyproject [project]) so the package
; builds correctly even on old system setuptools (<61, e.g. Ubuntu 22.04's
; 59.6) where PEP 621 support doesn't exist and builds silently produce
; UNKNOWN-0.0.0.
[metadata]
name = perch-dashboard
version = 1.3.0
description = Perch — a local system + developer dashboard for Linux
long_description = file: README.md
long_description_content_type = text/markdown
license = MIT
author = Perch contributors
keywords = dashboard, system-monitor, linux, devtools, psutil
url = https://github.com/dwarka-prasad/perch
project_urls =
    Issues = https://github.com/dwarka-prasad/perch/issues
classifiers =
    Environment :: Console
    Environment :: Web Environment
    Intended Audience :: Developers
    License :: OSI Approved :: MIT License
    Operating System :: POSIX :: Linux
    Programming Language :: Python :: 3
    Topic :: System :: Monitoring

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.8
install_requires =
    psutil>=5.9
    PyYAML>=5.4

[options.packages.find]
where = src

[options.package_data]
perch =
    web/index.html
    web/static/*

[options.extras_require]
office =
    python-docx>=1.0
    openpyxl>=3.1
desktop =
    PyGObject>=3.42

[options.entry_points]
console_scripts =
    perch = perch.server:main
    perch-desktop = perch.desktop:main
