# Package metadata is in setup.cfg (declarative), NOT a [project] table here:
# old system setuptools (<61) ignores PEP 621 metadata and would silently
# build UNKNOWN-0.0.0. setup.cfg works everywhere from setuptools 30 up.
[build-system]
requires = ["setuptools>=40", "wheel"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py38"

[tool.ruff.lint]
# Core correctness rules (pycodestyle errors/warnings, pyflakes). The broader
# opinionated sets (PL/SIM/…) are intentionally not enabled for this codebase.
select = ["E", "F", "W"]
